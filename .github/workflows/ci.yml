name: OpenRV

on:
  push:
    branches:
      - main
      - packageAndUpload

  pull_request: # This handles PR creation and subsequent commits.

  schedule:
    # Midnight build every day
    - cron: "0 0 * * *"

  # This allows manual triggering of the workflow from the web
  workflow_dispatch:
    inputs:
      SKIP_DEPS_CACHE:
        description: 'Skip dependencies caching'
        required: true
        default: 'false'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      cmake_changed: ${{ steps.filter.outputs.cmake }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            cmake:
              - 'cmake/**'
              - '**/CMakeLists.txt'
              - '**/*.cmake'

  linux:
    needs: detect-changes
    uses: ./.github/workflows/ci-linux.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      full_matrix: 'false'
      run_debug: 'false'

  windows:
    needs: detect-changes
    uses: ./.github/workflows/ci-windows.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      full_matrix: 'false'
      run_debug: 'false'

